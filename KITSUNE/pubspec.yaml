name: kitsune
description: KITSUNE — private offline-first HRT tracker.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5
  flutter_secure_storage: ^9.2.4
  local_auth: ^2.3.0
  crypto: ^3.0.6
  table_calendar: ^3.1.3
  fl_chart: ^0.70.2
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  image_picker: ^1.1.2
  file_picker: ^8.1.7
  share_plus: ^10.1.4
  pdf: ^3.11.1
  printing: ^5.13.4
  intl: ^0.19.0
  shared_preferences: ^2.3.4
  uuid: ^4.5.1
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/catalogs/
    - docs/hrt_tracker_product_specification.json
